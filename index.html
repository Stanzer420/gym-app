<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Tracking App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#3E3F97" id="themecolor">
<meta name="format-detection" content="telephone=no">
<style>[hidden]{display:none!important}body{margin:0}</style>
<style>
/* Layout: one-handed phone app in the iOS idiom. Filled rounded surfaces instead of outlines, the system font with rounded numerals, blue for Gym and orange for Food. */
:root{
  color-scheme:dark;
  --display:ui-rounded,-apple-system,BlinkMacSystemFont,'SF Pro Rounded','SF Pro Display',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --r-l:22px;--r-m:16px;--r-s:12px;
  --panel:rgba(255,255,255,.075);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.11);--well:rgba(0,0,0,.34);--ink:#F4F2F8;--mute:#ACA8B8;--good:#6FE3A5;--warn:#FFD479;--bad:#FF7A7A;
  /* bottom spacing for the home bar; reduced by --vgap when iOS already leaves a strip below the app (it does on iPhone home screen apps) */
  --sab:max(0px,calc(env(safe-area-inset-bottom,0px) - var(--vgap,0px)));
  --tabbg:#3E3F97;--bg:#0A0B18;--glow:#2D2E8E;--acc:#8F8BFF;--on:#0C0B33;--acc-a:rgba(143,139,255,.45);
}
[data-sec="gym"]{--mute:#ACA8B8;--tabbg:#3E3F97}
[data-sec="food"]{--tabbg:#6B3A27;--bg:#110C0A;--glow:#5E2914;--acc:#FF8A5C;--on:#210C03;--acc-a:rgba(255,138,92,.45);--ink:#F8F2EE;--mute:#BDAEA5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
/* iOS gives home screen apps a viewport one status bar shorter than the screen; the strip below it shows the page canvas, so paint the canvas in the tab bar colour */
html{background:var(--tabbg);transition:background .25s}
html.hyping{background:#040508}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--body);transition:background .25s;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left;touch-action:manipulation}
button:active{opacity:.75}
button:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* the app fills the whole screen; top inset clears the notch, the tab bar pads itself down to the screen edge */
#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#scroll{flex:1;min-height:0;overflow:hidden}
#pager{display:flex;width:200%;height:100%;transition:transform .3s cubic-bezier(.22,.8,.25,1);will-change:transform}
#pager.drag{transition:none}
.pane{width:50%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:linear-gradient(to top,var(--glow),var(--bg) 74%);color:var(--ink)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:12px;gap:12px}
.top h1{font:700 32px/1.05 var(--body);margin:0;letter-spacing:-.01em}
.icons{display:flex;gap:8px}
.ico{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);background:var(--panel);border-radius:50%;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.label{font:600 13px/1.2 var(--body);color:var(--mute)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--mute)}
.sample{display:inline-block;font:600 11px/1 var(--body);color:var(--warn);background:rgba(255,212,121,.14);border-radius:6px;padding:3px 6px;vertical-align:1px}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;background:var(--acc);color:var(--on);font:700 18px/1 var(--body);padding:0 16px;border-radius:var(--r-m);text-align:center}
.ghost{display:flex;align-items:center;justify-content:center;min-height:50px;background:var(--panel2);border-radius:var(--r-m);padding:0 14px;font-weight:600;text-align:center;cursor:pointer}
.linkbtn{min-height:44px;color:var(--ink);font-weight:500;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
/* tabs */
#tabs{flex:none;position:relative;background:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)),var(--glow);border-top:1px solid var(--line);padding-bottom:var(--sab)}
#tabs::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:var(--tabbg);pointer-events:none}
#tabbtn{display:grid;grid-template-columns:1fr 1fr}
#tabind{position:absolute;top:-1px;left:0;width:50%;height:3px;background:#fff;transition:transform .3s cubic-bezier(.22,.8,.25,1);z-index:1}
#tabind.drag{transition:none}
.tab{height:54px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 17px/1 var(--body);color:rgba(255,255,255,.62);position:relative;text-align:center}
.tab[aria-current="page"]{color:#fff;font-weight:700}
.tab .dot{width:7px;height:7px;border-radius:50%;background:#fff}
.warnbar{display:block;width:100%;background:rgba(255,212,121,.14);color:var(--warn);border-radius:var(--r-s);padding:11px 14px;font-weight:600;font-size:14.5px;text-align:left}
.warnslot:empty{display:none}
/* gym home */
.hero{background:var(--panel);border-radius:var(--r-l);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.hero .big{font:700 52px/1 var(--display);margin-top:4px}
.hero .meta{color:var(--mute);margin-top:6px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{min-height:44px;background:var(--panel2);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;font:600 14.5px/1 var(--body);color:var(--mute);text-align:center}
.chip.on{color:var(--on);background:var(--acc)}
.list{display:flex;flex-direction:column;background:var(--panel);border-radius:var(--r-m);padding:0 14px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;min-height:50px}
.line:last-child,.usual:last-child{border-bottom:0}
.line>div:first-child{min-width:0}
.line .t{font-weight:600}
.pr{display:inline-block;background:var(--acc);color:var(--on);font:700 12px/1 var(--display);padding:4px 7px;border-radius:7px}
.sect{display:flex;flex-direction:column;gap:8px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
/* live workout */
.status{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:10px;padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.status h1{font:700 28px/1.05 var(--body);margin:0}
.statusrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.finish{min-height:44px;padding:0 18px;background:var(--panel2);color:var(--acc);font:600 16px/1 var(--body);border-radius:22px;display:flex;align-items:center}
.goal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-radius:var(--r-s);font-size:14px;color:var(--mute)}
.goal b{font:600 15px/1 var(--body);color:var(--ink)}
.goal.hit{background:var(--acc);color:var(--on)}
.goal.hit b{color:var(--on)}
.exs{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--panel);border-radius:var(--r-m)}
.exhead{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;min-height:56px}
.exhead .n{font:600 17px/1.2 var(--body)}
.exhead .prg{font-size:14px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.exbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.setting{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:var(--r-s);padding:0 12px;min-height:46px}
.setting input{flex:1;min-width:0;background:none;border:0;padding:0;font-size:16px;min-height:44px;outline-offset:2px}
.setting input::placeholder{color:var(--mute);font-weight:400}
.setting.has input{color:var(--acc);font-weight:700}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 2px}
.facts>div{min-width:0}
.facts .v{font:500 16px/1.35 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.setrow{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;background:var(--panel2);border-radius:var(--r-s);gap:10px}
.setrow .sv{font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.setrow.done{background:none;color:var(--mute)}
.setrow.done .sv{color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:6px}
.active{background:var(--panel2);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:12px}
.beat{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:22px}
.beat .need{font:600 15px/1.15 var(--display);text-align:right}
.beat .need.yes{color:var(--acc)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stpc{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;background:var(--well);border-radius:var(--r-m);height:60px;overflow:hidden}
.stpc button{height:100%;display:grid;place-items:center;font:500 26px/1 var(--body);color:var(--acc)}
.stpc button:active{background:var(--panel2)}
.stpc input{width:100%;min-width:0;border:0;background:none;text-align:center;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;padding:0;outline-offset:-2px}
.stpc .val{text-align:center;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.setctl{display:flex;justify-content:center;gap:24px}
@keyframes flash{0%{transform:scale(.97);opacity:.5}100%{transform:none;opacity:1}}
.flash{animation:flash .45s ease-out}
/* food */
.macro{display:flex;flex-direction:column;gap:14px;background:var(--panel);border-radius:var(--r-l);padding:16px}
.kcalrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.kcal{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums}
.kcal small{font:500 16px/1 var(--display);color:var(--mute);margin-left:4px}
.left{text-align:right;font:600 17px/1.15 var(--display)}
.ruler{height:12px;background:var(--panel2);position:relative;overflow:hidden;border-radius:6px}
.ruler i{position:absolute;inset:0 auto 0 0;background:var(--acc);display:block;border-radius:6px}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mac3>div{min-width:0;display:flex;flex-direction:column;gap:5px}
.mac3 .v{font:600 19px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mac3 .v small{font:500 13px/1 var(--display);color:var(--mute)}
.bar{height:5px;background:var(--panel2);position:relative;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);display:block;border-radius:3px}
.bar.ok i{background:var(--good)}
.ok-t{color:var(--good);font-size:12px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:var(--r-s);padding:3px}
.seg button{min-height:36px;text-align:center;font-weight:600;font-size:14px;color:var(--mute);border-radius:9px}
.seg button.on{background:var(--well);color:var(--ink)}
.searchbar{display:grid;grid-template-columns:minmax(0,1fr) 50px 50px;gap:8px}
.sbtn{min-height:50px;display:flex;align-items:center;padding:0 16px;color:var(--mute);background:var(--panel);border-radius:25px}
.sbtn.i{justify-content:center;padding:0;color:var(--acc)}
.sbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.usual{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.usual .main{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 6px 10px 0;min-height:58px}
.usual .edit{width:40px;display:grid;place-items:center;color:var(--mute);flex:none}
.usual .edit svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.plus{font:600 17px/1 var(--display);color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.supps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.supp{min-height:46px;background:var(--panel);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:13.5px;color:var(--mute);padding:2px}
.supp.on{background:var(--acc);color:var(--on)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;background:linear-gradient(to top,var(--glow),var(--bg) 74%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:var(--sab)}
.shead{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:560px;width:100%;margin:0 auto}
.shead h2{font:700 24px/1.1 var(--body);margin:0;flex:1;min-width:0}
.sbody{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input{width:100%;min-height:50px;background:var(--panel);border:0;padding:0 14px;font-size:16px;border-radius:var(--r-s)}
.input::placeholder{color:var(--mute)}
.input.miss{box-shadow:inset 0 0 0 2px var(--warn)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--panel);border-radius:var(--r-m);padding:12px 14px}
.totals>div{min-width:0}
.totals .v{font:600 18px/1.1 var(--display);margin-top:3px;font-variant-numeric:tabular-nums}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .tt{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.item .stpc{height:50px}
.item .stpc .val{font-size:20px}
.callout{background:var(--panel);border-radius:var(--r-m);padding:12px 14px;font-size:14.5px;color:var(--mute)}
.callout b{color:var(--ink)}
.callout.bad{color:var(--bad)}
.scanv{position:relative;height:250px;background:#000;border-radius:var(--r-l);overflow:hidden;flex:none}
.scanv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanv .aim{position:absolute;left:10%;right:10%;top:36%;bottom:36%;border:2px solid var(--acc);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.chart{width:100%;display:block;touch-action:pan-y}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:28px}
.readout .num{font-size:22px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border-radius:var(--r-m);padding:12px 14px}
.tile .v{font:700 28px/1 var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.look{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r-m);padding:12px 14px;min-height:54px;width:100%}
.look.on{box-shadow:inset 0 0 0 2px var(--ink)}
.swatch{width:46px;height:34px;border-radius:11px;flex:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(64px + var(--sab));z-index:80;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px;min-height:50px;font-weight:600;max-width:528px;margin:0 auto;border-radius:var(--r-m);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast button{font-weight:700;min-height:44px;color:inherit;flex:none}
/* device test */
.trow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tx{min-width:0;flex:1}
.trow .tx .small{overflow-wrap:anywhere}
.badge{flex:none;min-width:50px;text-align:center;border-radius:7px;font:700 12px/1 var(--body);padding:6px 6px;margin-top:1px;background:var(--panel2);color:var(--mute)}
.badge.pass{background:var(--good);color:#06220f}
.badge.fail{background:var(--bad);color:#2b0606}
.mt{background:var(--panel);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mt .tt{display:flex;gap:10px;align-items:baseline;justify-content:space-between;font-weight:600}
.mt .how{font-size:14.5px;color:var(--mute)}
.mt .tools{display:flex;flex-wrap:wrap;gap:8px}
.mt .tools .ghost{min-height:40px;font-size:14.5px;padding:0 12px;border-radius:var(--r-s)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf button{min-height:42px;border-radius:var(--r-s);background:var(--panel2);text-align:center;font-weight:700;color:var(--mute)}
.pf button.pass.on{background:var(--good);color:#06220f}
.pf button.fail.on{background:var(--bad);color:#2b0606}
.mt input.input{min-height:42px;background:var(--panel2)}
.vswitch{display:flex;align-items:center;gap:10px;min-height:40px}
.vswitch input{width:51px;height:31px}
.tickover{position:relative;overflow:hidden}
.tickover input,.tickbtn .tickin{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:.01}
/* Log set / Log PR: the finger lands on an invisible iOS switch, which gives a haptic tick; the tap still runs the action */
.tickbtn{position:relative;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
.tickbtn:active{opacity:.75}
/* hidden switch used for the haptic tick; it must stay rendered, so it is moved out of sight instead of hidden */
#hap{position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;overflow:hidden;pointer-events:none;z-index:-1}
/* set that would be a PR */
.prsign{display:inline-block;background:var(--acc);color:var(--on);padding:6px 12px;border-radius:15px;font-weight:700;animation:signwig 1.15s ease-in-out infinite}
.primary.armbtn{min-height:72px;font-size:23px;box-shadow:0 0 26px var(--acc-a);animation:armbuzz .7s linear infinite}
.armpop.primary.armbtn{animation:armpop .42s cubic-bezier(.2,1.4,.4,1) both,armbuzz .7s .42s linear infinite}
.armpop.prsign{animation:signpop .45s cubic-bezier(.2,1.5,.4,1) both,signwig 1.15s .45s ease-in-out infinite}
@keyframes armbuzz{0%,52%,100%{transform:none}4%{transform:translate(-2.5px,1px) rotate(-.6deg)}10%{transform:translate(2.5px,-1px) rotate(.6deg)}16%{transform:translate(-2.5px,-1px) rotate(-.5deg)}22%{transform:translate(2px,1px) rotate(.5deg)}28%{transform:translate(-2px,1px) rotate(-.4deg)}34%{transform:translate(2px,-1px) rotate(.3deg)}40%{transform:translate(-1px,0)}46%{transform:translate(1px,0)}76%{transform:scale(1.025)}}
@keyframes armpop{0%{transform:scale(.8)}60%{transform:scale(1.09)}100%{transform:none}}
@keyframes signwig{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.06)}}
@keyframes signpop{0%{transform:scale(.3) rotate(-14deg);opacity:0}70%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:none}}
/* reward popup */
#hype{position:fixed;inset:0;z-index:60;background:rgba(4,5,8,.93);display:flex;padding:calc(env(safe-area-inset-top,0px) + 8px) max(8px,env(safe-area-inset-right,0px)) calc(var(--sab) + 10px) max(8px,env(safe-area-inset-left,0px));animation:hfade .12s linear both;overflow:hidden;touch-action:none}
.hstage{position:relative;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;animation:hquake .95s .25s linear both;will-change:transform}
.himgwrap{position:relative;flex:1;min-height:0;width:100%;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 22px 70px rgba(0,0,0,.7);animation:hsmash .85s both;will-change:transform}
.himgwrap img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;object-fit:cover}
.hshade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.hkicker{position:absolute;left:14px;top:14px;background:var(--acc);color:var(--on);font:800 16px/1 var(--body);padding:9px 14px;border-radius:18px}
.hcap{position:absolute;left:16px;right:16px;bottom:15px;font:700 19px/1.2 var(--body);color:#fff;font-variant-numeric:tabular-nums}
.hflash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;animation:hflash .34s .25s ease-out both;z-index:2}
.hring{position:fixed;left:50%;top:44%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:12px solid var(--acc);pointer-events:none;animation:hring .62s .25s cubic-bezier(.1,.7,.3,1) both;z-index:3}
.hring.r2{animation-delay:.34s;border-width:7px;border-color:#fff}
.hbit{position:fixed;left:50%;top:44%;width:13px;height:13px;border-radius:3px;background:var(--acc);pointer-events:none;animation:hbit .8s .25s cubic-bezier(.08,.75,.25,1) both;z-index:3}
.hbit:nth-of-type(3n){background:#fff;width:8px;height:8px}
.hbtn{flex:none;width:100%;min-height:68px;border-radius:22px;background:var(--acc);color:var(--on);font:800 24px/1.1 var(--body);text-align:center;animation:hbtn .4s .78s cubic-bezier(.2,1.5,.4,1) both}
@keyframes hfade{from{opacity:0}to{opacity:1}}
@keyframes hsmash{0%{transform:scale(3.6) rotate(-9deg);opacity:0;animation-timing-function:cubic-bezier(.7,0,1,.7)}8%{opacity:1;animation-timing-function:cubic-bezier(.7,0,1,.7)}30%{transform:scale(.84) rotate(2deg);animation-timing-function:ease-out}44%{transform:scale(1.1) rotate(-1.4deg);animation-timing-function:ease-in-out}58%{transform:scale(.96) rotate(.6deg);animation-timing-function:ease-in-out}76%{transform:scale(1.02) rotate(0);animation-timing-function:ease-in-out}100%{transform:none;opacity:1}}
@keyframes hquake{0%,100%{transform:none}5%{transform:translate(-26px,16px) rotate(-3deg)}11%{transform:translate(24px,-18px) rotate(2.6deg)}17%{transform:translate(-22px,-12px) rotate(-2.4deg)}23%{transform:translate(20px,14px) rotate(2deg)}30%{transform:translate(-16px,10px) rotate(-1.6deg)}37%{transform:translate(14px,-10px) rotate(1.3deg)}45%{transform:translate(-10px,-7px) rotate(-1deg)}53%{transform:translate(9px,6px) rotate(.8deg)}62%{transform:translate(-6px,4px) rotate(-.5deg)}71%{transform:translate(5px,-3px) rotate(.3deg)}81%{transform:translate(-3px,2px)}91%{transform:translate(2px,-1px)}}
@keyframes hflash{0%{opacity:.9}100%{opacity:0}}
@keyframes hring{0%{transform:scale(.2);opacity:1}100%{transform:scale(5);opacity:0}}
@keyframes hbit{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes hbtn{from{transform:translateY(90px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flash,#hype,.hstage,.himgwrap,.hbtn,.prsign,.primary.armbtn,.armpop.primary.armbtn,.armpop.prsign{animation:none}.hring,.hbit,.hflash{display:none}body{transition:none}#pager,#tabind{transition:none}}
</style></head><body data-sec="gym">

<div id="app"><div id="scroll"><div id="pager"><div class="pane" id="pane-gym" data-sec="gym"></div><div class="pane" id="pane-food" data-sec="food"></div></div></div><nav id="tabs" aria-label="Sections"><div id="tabind"></div><div id="tabbtn"></div></nav></div>
<label id="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="hype" hidden></div>
<noscript><p style="padding:40px 20px">This app needs JavaScript.</p></noscript>

<script>
'use strict';
const APP_VERSION='0.3.3';
/* ---------- personal data lives in the private repo; these are filled from local storage at start ---------- */
let SPLIT=[],EX={},FOODS=[],SUPPS=[],MAINT=2500,BASE_MEALS=[],TEST_BC=[];
const PHASES=[['cut','Lose fat',-400],['main','Maintain',0],['lean','Lean gain',250],['bulk','Bulk',500]];
const goalsFor=d=>{const g=S.goals,t=MAINT+d,r=t-400,c=(k,x)=>Math.max(0,Math.round((k-x.p*4-x.f*9)/4/5)*5);return{training:{k:t,p:g.training.p,c:c(t,g.training),f:g.training.f},rest:{k:r,p:g.rest.p,c:c(r,g.rest),f:g.rest.f}}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- PR logic ---------- */
const D=x=>x[2]==null?x[0]:x[2];
const isPR=(recs,w,r,d)=>{const dd=d==null?w:d;return r>0&&!recs.some(x=>x[0]>=w&&D(x)>=dd&&x[1]>=r)};
const target=(recs,w,d)=>{const dd=d==null?w:d;let m=0;recs.forEach(x=>{if(x[0]>=w&&D(x)>=dd&&x[1]>m)m=x[1]});return m+1};
const pareto=recs=>recs.filter((x,i)=>!recs.some((y,j)=>j!==i&&y[0]>=x[0]&&D(y)>=D(x)&&y[1]>=x[1]&&(y[0]>x[0]||D(y)>D(x)||y[1]>x[1]))).filter((x,i,a)=>a.findIndex(y=>y[0]===x[0]&&D(y)===D(x)&&y[1]===x[1])===i).sort((a,b)=>a[0]-b[0]);
const e1rm=(w,r)=>w===0?r:w*(1+r/30);

/* ---------- seed conversion ---------- */
function cfgFromSeed(sd){
 if(!sd||!Array.isArray(sd.split)||!Array.isArray(sd.foods))throw new Error('The seed data has no split or foods');
 const tag=s=>{s=String(s||'').toLowerCase();return /unconfirmed|placeholder/.test(s)?'placeholder':/package|pack/.test(s)?'pack':/listing|label/.test(s)?'label':'typical'};
 const notes={};
 const split=sd.split.map(d=>({id:d.id,name:d.name,sub:d.muscleGroup||'',ex:(d.exercises||[]).map(e=>{if(e.setting)notes[e.id]=e.setting;return{id:e.id,n:e.name,sets:Math.max(3,+e.defaultSets||3),drop:!!e.everySetIsDropSet,bw:!!e.bodyweight,rec:(e.records||[]).map(r=>r.dropToKg!=null?[+r.weightKg,+(r.totalReps!=null?r.totalReps:r.reps),+r.dropToKg]:[+r.weightKg,+r.reps])}})}));
 const foods=sd.foods.map(f=>{const o={id:f.id,n:f.name,a:(f.aliases||[]).map(x=>String(x).toLowerCase()),u:f.unit==='piece'||f.unit==='pc'?'pc':(f.unit||'g'),k:+f.kcal||0,p:+f.proteinG||0,c:+f.carbsG||0,f:+f.fatG||0,tag:tag(f.source)};if(f.gramsPerPiece)o.g=+f.gramsPerPiece;if(f.barcode)o.bc=String(f.barcode);return o});
 const meals=(sd.meals||[]).map(m=>{const o={id:m.id,n:m.name,sub:m.subtitle||'',items:(m.items||[]).map(i=>[i.food,+i.amount]),usual:m.usual?1:0};if(m.ticksSupplements)o.supp=1;if(m.batchPortions)o.batch=+m.batchPortions;if(m.suggestOnIsoWeekdays)o.weekdays=m.suggestOnIsoWeekdays.map(x=>x%7);return o});
 const g=sd.goals||{};
 const goals={training:Object.assign({k:3000,p:150,c:350,f:80},g.training),rest:Object.assign({k:2600,p:150,c:250,f:80},g.rest)};
 return{v:1,split,foods,meals,notes,supps:sd.supplements||[],maint:+g.maintenanceEstimateKcal||goals.training.k,phase:g.phase||'main',goals,bwStart:+sd.bodyWeightStartKg||null,baseMeals:meals.map(m=>m.id),testBarcodes:(sd.testBarcodes||[]).map(String)};
}
const stateFromCfg=cfg=>({schema:1,tab:'gym',phase:cfg.phase,goals:clone(cfg.goals),nextIdx:0,sessions:[],bw:[],cur:null,days:{},foods:[],meals:clone(cfg.meals),notes:clone(cfg.notes),cfg});
function applyCfg(){const c=S.cfg;SPLIT=c.split;EX={};SPLIT.forEach(d=>d.ex.forEach(e=>EX[e.id]=e));FOODS=c.foods;SUPPS=c.supps;MAINT=c.maint;BASE_MEALS=c.baseMeals||[];TEST_BC=c.testBarcodes||[];if(S.nextIdx>=SPLIT.length)S.nextIdx=0}

/* ---------- storage: IndexedDB ---------- */
const DB=(()=>{let p=null;
 const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('gymapp',1);r.onupgradeneeded=()=>{const d=r.result;['kv','photos','off'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();p=null};d.onclose=()=>{p=null};res(d)};r.onerror=()=>{p=null;rej(r.error)};r.onblocked=()=>rej(new Error('Storage is blocked by another open copy of the app'))}));
 const tx=(store,mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode,mode==='readwrite'?{durability:'strict'}:undefined),q=fn(t.objectStore(store));let out;if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error||new Error('Storage error'))}));
 return{get:(s,k)=>tx(s,'readonly',o=>o.get(k)),set:(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),keys:s=>tx(s,'readonly',o=>o.getAllKeys()),clear:s=>tx(s,'readwrite',o=>o.clear())}})();
let S=null,GHC=null,BK={},PERSIST={},CAM={},WL={},EXP={},DT={auto:{},manual:{}},SWINFO={};
let flushP=null,dirty=false,saveErr=null,lastSaved=0;
const save=()=>{dirty=true;if(!flushP)flushP=flush()};
const saved=()=>flushP||Promise.resolve();
async function flush(){try{while(dirty){dirty=false;try{await DB.set('kv','state',S);saveErr=null;lastSaved=Date.now()}catch(e){saveErr=e;console.error(e)}}}finally{flushP=null}}
let armedKey=null,sheet=null,flashId=null,toastT=null,draft=null;

const iso=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date(Date.now()-4*36e5)); /* the day changes at 04:00 */
const day=()=>{const k=today();if(!S.days[k])S.days[k]={type:'rest',entries:[],supps:[]};return S.days[k]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const v=Math.round(n*10)/10;return String(v)};
const int=n=>Math.round(n).toLocaleString('en-US');
const wTxt=w=>w===0?'BW':fmt(w);
const setTxt=(w,r,d)=>w===0?`BW × ${r}`:d!=null&&d<w?`${fmt(w)} → ${fmt(d)} × ${r}`:`${fmt(w)} × ${r}`;
const shortDate=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const allFoods=()=>FOODS.concat(S.foods);
const food=id=>allFoods().find(f=>f.id===id);
const fac=(f,a)=>f.u==='pc'?a:a/100;
const macros=items=>items.reduce((m,[id,a])=>{const f=food(id);if(!f)return m;const x=fac(f,a);m.k+=(f.k||0)*x;m.p+=(f.p||0)*x;m.c+=(f.c||0)*x;m.f+=(f.f||0)*x;return m},{k:0,p:0,c:0,f:0});
const unit=f=>f.u==='pc'?'×':f.u;
const amtTxt=(f,a)=>f.u==='pc'?`${fmt(a)} ×`:`${fmt(a)} ${f.u}`;
const stepFor=(f,a)=>f.u==='pc'?1:a>=100?10:5;
const ago=t=>{if(!t)return 'never';const m=(Date.now()-t)/6e4;return m<2?'just now':m<90?Math.round(m)+' min ago':m<36*60?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const stamp=t=>t?new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';

/* ---------- gym data helpers ---------- */
const allRecs=exId=>{const out=EX[exId].rec.map(x=>x.slice());S.sessions.forEach(s=>s.sets.forEach(t=>{if(t.ex===exId)out.push([t.w,t.r,t.d])}));return out};
const workRec=e=>e.rec.length?e.rec.slice().sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0]:[20,10];
/* no session logged yet: pre-fill from the PR list instead of inventing a last session */
const lastFor=exId=>{for(let i=S.sessions.length-1;i>=0;i--){const t=S.sessions[i].sets.filter(x=>x.ex===exId);if(t.length)return{date:S.sessions[i].date,sets:t.map(x=>[x.w,x.r,x.d]),real:true}}const e=EX[exId],[w,r,d]=workRec(e);return{sets:Array.from({length:e.sets||3},()=>[w,r,d]),real:false}};
const startWorkout=idx=>{const d=SPLIT[idx];S.cur={day:d.id,idx,seq:0,open:0,started:Date.now(),ex:d.ex.map(e=>{const s=lastFor(e.id).sets.map(([w,r,d])=>({w,r,d,done:false,pr:false}));while(s.length<3){const l=s[s.length-1]||{w:20,r:10};s.push({w:l.w,r:l.r,d:l.d,done:false,pr:false})}return{id:e.id,sets:s}})};day().type='training';save();sheet=null;render();keepAwake()};
const recalc=()=>{const c=S.cur;c.ex.forEach(x=>{const run=allRecs(x.id);x.sets.filter(t=>t.done).sort((a,b)=>a.seq-b.seq).forEach(t=>{t.pr=isPR(run,t.w,t.r,t.d);run.push([t.w,t.r,t.d])});x.sets.forEach(t=>{if(!t.done)t.pr=false})})};
const curRecs=x=>{const run=allRecs(x.id);x.sets.filter(t=>t.done).forEach(t=>run.push([t.w,t.r,t.d]));return run};
const prCount=()=>S.cur?S.cur.ex.reduce((n,x)=>n+x.sets.filter(t=>t.pr).length,0):0;

/* ---------- screen stays on during a workout ---------- */
let wlock=null;
async function keepAwake(){if(!S||!S.cur)return;if(!('wakeLock' in navigator)){WL={ok:false,err:'Wake Lock API not available'};return}if(wlock&&!wlock.released)return;try{wlock=await navigator.wakeLock.request('screen');WL={ok:true,at:Date.now()};wlock.addEventListener('release',()=>{WL.releasedAt=Date.now()})}catch(e){WL={ok:false,err:e.name+': '+e.message,at:Date.now()}}}
function releaseAwake(){if(wlock){wlock.release().catch(()=>{});wlock=null}}

/* ---------- icons ---------- */
const I={chart:'<svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16l4-5 3 3 5-7"/></svg>',gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',scan:'<svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>',mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3"/></svg>'};
const stepper=(lbl,val,act,idAttr)=>`<div class="stp"><span class="label">${lbl}</span><div class="stpc"><button data-a="${act}" data-d="-1" aria-label="Less ${lbl}">−</button>${idAttr?`<input id="${idAttr}" inputmode="decimal" value="${val}" aria-label="${lbl}" data-c="${act}">`:`<div class="val num" id="${act}-v">${val}</div>`}<button data-a="${act}" data-d="1" aria-label="More ${lbl}">+</button></div></div>`;
const topbar=(title,stats)=>`<div class="top"><h1>${title}</h1><div class="icons"><button class="ico" data-a="open" data-s="${stats}" aria-label="Statistics">${I.chart}</button><button class="ico" data-a="open" data-s="settings" aria-label="Settings">${I.gear}</button></div></div>`;
const backupStale=()=>!BK.lastOk||Date.now()-BK.lastOk>7*864e5;
function warnHTML(){if(!GHC)return `<button class="warnbar" data-a="open" data-s="settings">Backup is off. Connect GitHub in Settings.</button>`;if(BK.lastTry&&backupStale())return `<button class="warnbar" data-a="open" data-s="settings">Last successful backup: ${ago(BK.lastOk)}. Tap to check.</button>`;return ''}
const refreshWarn=()=>document.querySelectorAll('.warnslot').forEach(el=>{el.innerHTML=warnHTML()});

/* ---------- gym screens ---------- */
function gymHome(){
 const sel=window.__pick==null?S.nextIdx:window.__pick;const pd=SPLIT[sel];
 const bw=S.bw.length?S.bw[S.bw.length-1]:null;
 const recent=S.sessions.slice(-4).reverse();
 const sets=pd.ex.reduce((n,e)=>n+Math.max(3,lastFor(e.id).sets.length),0);
 return `<div class="wrap">${topbar('Gym','gymstats')}<div class="warnslot">${warnHTML()}</div>
 <section class="hero">
  <div><div class="label">${sel===S.nextIdx?'Up next':'Selected'}</div><div class="big">${esc(pd.name)}</div><div class="meta">${pd.ex.length} exercises · ${sets} sets ready to log</div></div>
  <div class="chips" role="group" aria-label="Choose workout">${SPLIT.map((s,i)=>`<button class="chip ${i===sel?'on':''}" data-a="pick" data-i="${i}">${esc(s.name)}</button>`).join('')}</div>
  <button class="primary" data-a="start" data-i="${sel}">Start ${esc(pd.name)}</button>
 </section>
 <section class="sect"><div class="secthead"><span class="label">In this workout</span><span class="small">Heaviest PR</span></div><div class="list">
  ${pd.ex.map(e=>{const p=pareto(allRecs(e.id));const b=p[p.length-1];return `<div class="line"><div class="t">${esc(e.n)}</div><div class="num" style="white-space:nowrap;font-size:17px;font-weight:600">${b?setTxt(b[0],b[1],b[2]):'—'}</div></div>`}).join('')}
 </div></section>
 <section class="sect"><div class="secthead"><span class="label">Recent sessions</span>${bw?`<span class="small">Body weight ${fmt(bw.v)} kg</span>`:''}</div>
  ${recent.length?`<div class="list">${recent.map(s=>{const sd=SPLIT.find(x=>x.id===s.day);return `<div class="line"><div><div class="t">${esc(sd?sd.name:s.day)}</div><div class="small">${shortDate(s.date)} · ${s.sets.length} sets</div></div>${s.sets.some(t=>t.pr)?`<span class="pr">${s.sets.filter(t=>t.pr).length} PR</span>`:'<span class="small">No PR</span>'}</div>`}).join('')}</div>`:`<p class="small" style="margin:0">Your finished workouts appear here.</p>`}
 </section></div>`;
}
function gymLive(){
 const c=S.cur,d=SPLIT[c.idx];const tot=c.ex.reduce((n,x)=>n+x.sets.length,0),dn=c.ex.reduce((n,x)=>n+x.sets.filter(t=>t.done).length,0),prs=prCount();
 return `<div class="wrap" style="gap:12px">
 <div class="status"><div class="statusrow"><div><h1>${esc(d.name)}</h1><div class="small num" style="font-size:15px">${dn} of ${tot} sets</div></div><button class="finish" data-a="finishopen">Finish</button></div>
 <div class="goal ${prs?'hit':''}" id="goal">${prs?`<b>PR hit</b><b>${prs} this session</b>`:`<span>Session goal</span><b>Beat one target</b>`}</div></div>
 <div class="exs">${c.ex.map((x,i)=>exCard(x,i)).join('')}</div>
 <button class="linkbtn" data-a="discard">Cancel this workout</button>
 </div>`;
}
function exCard(x,i){
 const c=S.cur,e=EX[x.id],open=c.open===i,dn=x.sets.filter(t=>t.done).length,hasPR=x.sets.some(t=>t.pr);
 const head=`<button class="exhead" data-a="openex" data-i="${i}" aria-expanded="${open}"><span class="n">${esc(e.n)}</span><span class="prg">${hasPR?'<span class="pr">PR</span>':''}${dn}/${x.sets.length}</span></button>`;
 if(!open)return `<div class="ex" id="ex${i}">${head}</div>`;
 const l=lastFor(x.id);
 const recs=pareto(curRecs(x));
 const ai=x.sets.findIndex(t=>!t.done);
 const facts=`<div class="facts"><div><div class="label">Last${l.real?' · '+shortDate(l.date):''}</div><div class="v">${l.real?l.sets.map(s=>setTxt(s[0],s[1],s[2])).join('<br>'):'<span class="small">No session logged yet</span>'}</div></div><div><div class="label">PRs</div><div class="v">${recs.map(s=>setTxt(s[0],s[1],s[2])).join('<br>')||'—'}</div></div></div>`;
 const rows=x.sets.map((t,si)=>{
  if(t.done)return `<button class="setrow done ${flashId===x.id+si?'flash':''}" data-a="redo" data-i="${i}" data-j="${si}" aria-label="Edit set ${si+1}"><span>Set ${si+1}</span><span style="display:flex;gap:8px;align-items:center">${t.pr?'<span class="pr">PR</span>':''}<span class="sv">${setTxt(t.w,t.r,t.d)}</span></span></button>`;
  if(si===ai)return activeSet(x,t,si,i);
  return `<div class="setrow"><span class="small">Set ${si+1}</span><span class="sv" style="color:var(--mute)">${setTxt(t.w,t.r,t.d)}</span></div>`;

/* ---------- dictation / typed-amount parser ---------- */
const NUMW={ein:1,eine:1,einen:1,eins:1,a:1,an:1,one:1,zwei:2,two:2,drei:3,three:3,vier:4,four:4,fünf:5,five:5,sechs:6,six:6,acht:8,eight:8};
function matchFood(q){q=q.toLowerCase().trim();if(!q)return null;let best=null,score=0;allFoods().forEach(f=>{(f.a||[]).concat(f.n.toLowerCase()).forEach(a=>{let s=0;if(q===a)s=100+a.length;else if(a.length>=3&&new RegExp('(^|[^a-zäöüß])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(q))s=50+a.length;else if(q.length>=3&&a.startsWith(q))s=30+q.length;else if(q.length>=4&&a.includes(q))s=10+q.length;if(s>score){score=s;best=f}})});return best}
function parseSpoken(text){
 const parts=text.split(/\s*(?:,|;|\n|\bund\b|\band\b|\bplus\b|\bdazu\b|\bwith\b)\s*/i).filter(Boolean);
 return parts.map(raw=>{
  let s=raw.trim().toLowerCase().replace(/^(ich hatte|ich habe|i had|i ate)\s+/,'');
  const w=s.split(/\s+/);if(NUMW[w[0]]){w[0]=String(NUMW[w[0]]);s=w.join(' ')}
  const m=s.match(/^(\d+(?:[.,]\d+)?)\s*(kilogramm|kilo|kg|gramm|gram|grams|gr|g|milliliter|ml|liter|l|stück|stueck|stk|x|mal|scoops?|portion(?:en)?)?\b\.?\s*(?:von |of )?(.*)$/i);
  let amt=null,un=null,name=s;if(m){amt=parseFloat(m[1].replace(',','.'));un=(m[2]||'').toLowerCase();name=m[3]}
  const f=matchFood(name);if(!f)return{raw,food:null};
  if(amt==null)amt=f.u==='pc'?1:100;
  if(/^(kg|kilo)/.test(un)||un==='l'||un==='liter')amt*=1000;
  if(f.u==='pc'&&/^(g|gr|gram|gramm|grams)$/.test(un))amt=Math.round(amt/f.g*10)/10;
  if(f.u!=='pc'&&!un&&amt<10)amt=amt*(f.id==='egg'?1:100);
  return{raw,food:f,amt};
 });
}

function chart(pts,opt={}){
 const W=360,H=170,L=38,R=10,T=10,B=24;const ys=pts.map(p=>p.v).concat(opt.goal!=null?[opt.goal]:[]);
 let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
 const rawS=(hi-lo)/3,mag=Math.pow(10,Math.floor(Math.log10(rawS))),norm=rawS/mag,stepV=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;lo=Math.floor(lo/stepV)*stepV;hi=Math.ceil(hi/stepV)*stepV;const tk=[];for(let v=lo;v<=hi+stepV/2;v+=stepV)tk.push(v);
 const X=i=>L+(pts.length<2?(W-L-R)/2:i/(pts.length-1)*(W-L-R)),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
 const area=`${d} L${X(pts.length-1).toFixed(1)} ${H-B} L${X(0).toFixed(1)} ${H-B} Z`;
 const dec=stepV<1?1:0;
 const last=pts[pts.length-1];
 return `<div class="sect" data-chart='${esc(JSON.stringify({pts,L,R,W,unit:opt.unit||''}))}'>
 <div class="readout"><span class="small rd-d">${shortDate(last.d)}</span><span class="num rd-v">${fmt(last.v)} <span class="small">${opt.unit||''}</span></span></div>
 <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Chart')}">
 ${tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" fill="var(--mute)" font-size="11">${v.toLocaleString('en-US',{maximumFractionDigits:dec})}</text>`).join('')}
 ${opt.goal!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(opt.goal).toFixed(1)}" y2="${Y(opt.goal).toFixed(1)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 4"/><text x="${W-R}" y="${(Y(opt.goal)-5).toFixed(1)}" text-anchor="end" fill="var(--ink)" font-size="11">Goal</text>`:''}
 <path d="${area}" fill="var(--acc)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
 <circle class="dotm" cx="${X(pts.length-1).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/>
 <text x="${L}" y="${H-6}" fill="var(--mute)" font-size="11">${shortDate(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="var(--mute)" font-size="11">${shortDate(last.d)}</text>
 </svg></div>`;
}

/* ---------- GitHub: private data repo, read and write with a fine-grained token ---------- */
const GH_API='https://api.github.com';
const enc64=str=>{const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const dec64=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const cpath=p=>p.split('/').map(encodeURIComponent).join('/');
const defaultRepo=()=>/\.github\.io$/i.test(location.hostname)?location.hostname.split('.')[0]+'/gym-app-data':'';
async function gh(path,{method='GET',body,raw,cfg}={}){
 const g=cfg||GHC;if(!g||!g.token)throw new Error('GitHub is not connected');
 const h={'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','Authorization':'Bearer '+g.token,'X-GitHub-Api-Version':'2022-11-28'};
 if(body)h['Content-Type']='application/json';
 try{return await fetch(GH_API+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'})}catch(e){throw new Error('No connection to GitHub')}
}
async function ghErr(r,what){let m='';try{m=(await r.json()).message||''}catch(e){}const hint=r.status===401?'The token was not accepted. It may be mistyped or expired.':r.status===403?'The token lacks permission. It needs Contents: Read and write.':r.status===404?'Not found. Check the repository name and that the token includes this repository.':'';return new Error(`${what}: HTTP ${r.status}. ${hint||m}`)}
const cURL=(path,cfg)=>`/repos/${(cfg||GHC).repo}/contents/${cpath(path)}`;
async function ghRepo(cfg){const r=await gh(`/repos/${cfg.repo}`,{cfg});if(!r.ok)throw await ghErr(r,'Repository check');return r.json()}
async function ghMeta(path,cfg){const r=await gh(cURL(path,cfg),{cfg});if(r.status===404)return null;if(!r.ok)throw await ghErr(r,'Reading '+path);return r.json()}
async function ghText(path,cfg){const j=await ghMeta(path,cfg);if(!j)return null;if(j.encoding==='base64'&&j.content)return{sha:j.sha,text:dec64(j.content)};const r=await gh(cURL(path,cfg),{raw:true,cfg});if(!r.ok)throw await ghErr(r,'Reading '+path);return{sha:j.sha,text:await r.text()}}
async function ghBin(path,cfg){const r=await gh(cURL(path,cfg),{raw:true,cfg});if(!r.ok)throw await ghErr(r,'Reading '+path);return r.arrayBuffer()}
async function ghList(dir,cfg){const j=await ghMeta(dir,cfg);return Array.isArray(j)?j:[]}
async function ghPut(path,text,message,sha){const go=s=>gh(cURL(path),{method:'PUT',body:Object.assign({message,content:enc64(text)},s?{sha:s}:{})});let r=await go(sha);if(r.status===409||r.status===422){const m=await ghMeta(path);r=await go(m&&m.sha)}if(!r.ok)throw await ghErr(r,'Saving '+path);return(await r.json()).content.sha}

const stateForHash=()=>{const o=Object.assign({},S);delete o.tab;return JSON.stringify(o)};
async function sha256(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')}
const backupDoc=()=>({format:'gym-app-backup',formatVersion:1,app:APP_VERSION,createdAt:new Date().toISOString(),day:today(),state:S});
const saveBK=()=>DB.set('kv','backupMeta',BK).catch(()=>{});
let bkBusy=null;
const backup=reason=>bkBusy||(bkBusy=doBackup(reason).finally(()=>{bkBusy=null;refreshWarn()}));
async function doBackup(reason){
 if(!GHC)return{ok:false,msg:'GitHub is not connected'};
 if(!navigator.onLine)return{ok:false,msg:'Offline. The backup runs when you are online again.'};
 BK.lastTry=Date.now();
 try{
  const h=await sha256(stateForHash()),path=`backups/${today()}.json`;
  if(BK.hash===h&&BK.path){const m=await ghMeta(BK.path);if(m&&m.sha===BK.sha){Object.assign(BK,{lastOk:Date.now(),lastErr:null,lastMsg:'No changes since the last backup'});await saveBK();return{ok:true,msg:BK.lastMsg}}}
  let sha=BK.path===path?BK.sha:undefined;if(!sha){const m=await ghMeta(path);sha=m?m.sha:undefined}
  const nsha=await ghPut(path,JSON.stringify(backupDoc(),null,1),`Backup ${today()} ${new Date().toTimeString().slice(0,5)} (${reason})`,sha);
  Object.assign(BK,{path,sha:nsha,hash:h,lastOk:Date.now(),lastErr:null,lastMsg:'Saved to '+path,count:(BK.count||0)+1});await saveBK();return{ok:true,msg:BK.lastMsg};
 }catch(e){BK.lastErr=e.message||String(e);await saveBK();return{ok:false,msg:BK.lastErr}}
}

 throw new Error('This file is neither a backup nor seed data')}

async function offProduct(code,fresh){
 if(!fresh){const c=await cacheGet('p:'+code,30*864e5);if(c)return c}
 if(!navigator.onLine)throw new Error('Offline, so the product cannot be looked up. Type the values from the package.');
 take('p');
 let r;try{r=await fetch(OFF_P+encodeURIComponent(code)+'.json?fields='+OFF_FIELDS)}catch(e){throw new Error('Open Food Facts did not answer. Type the values from the package.')}
 if(r.status===404)return null;
 if(!r.ok)throw new Error(r.status===429||r.status===503?'Open Food Facts is busy. Try again in a minute.':'Open Food Facts error, HTTP '+r.status);
 let j;try{j=await r.json()}catch(e){throw new Error('Open Food Facts sent an unreadable answer')}
 const p=j.product?offToFood(Object.assign({code},j.product)):null;if(p)cachePut('p:'+code,p);return p}
async function offSearch(q){const key='s:'+q.toLowerCase().trim();const c=await cacheGet(key,864e5);if(c)return c;
 if(!navigator.onLine)throw new Error('Offline. Search works again when you are online.');take('s');
 let r;try{r=await fetch(OFF_S+'?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=20&fields='+OFF_FIELDS)}catch(e){throw new Error('Open Food Facts did not answer')}
 if(!r.ok)throw new Error(r.status===429||r.status===503?'Open Food Facts search is busy. Try again in a minute.':'Open Food Facts error, HTTP '+r.status);
 let j;try{j=await r.json()}catch(e){throw new Error('Open Food Facts search is temporarily unavailable. Try again later.')}
 const out=(j.products||[]).filter(p=>p.code).map(offToFood);cachePut(key,out);return out}
const missingVals=p=>['k','p','c','f'].some(k=>p[k]==null);
async function lookupCode(code){
 code=String(code).replace(/\D/g,'');if(code.length<8){scanMsg('A barcode has 8 to 14 digits.');return}
 stopCam();
 const own=allFoods().find(f=>f.bc===code);if(own){sheet={s:'amount',food:own.id,amt:own.u==='pc'?1:100};render();toast('Found: '+own.n);return}
 scanMsg('Looking up '+code+' …');
 try{const p=await offProduct(code);
  sheet=p?{s:'newfood',pre:p,why:missingVals(p)?'Some values are missing on Open Food Facts. Check the package and fill them in.':'Found on Open Food Facts. Check the values against the package, then save.'}:{s:'newfood',pre:{bc:code,u:'g'},why:`Barcode ${code} is not on Open Food Facts. Type the values from the package.`}}
 catch(e){sheet={s:'newfood',pre:{bc:code,u:'g'},why:e.message}}
 render()}

/* ---------- barcode scanner: bundled zxing-wasm, live camera ---------- */
let CAMS=null,scanLoop=null,zxP=null;
const ZXOPT={formats:['EAN13','EAN8','UPCA','UPCE'],tryHarder:true,maxNumberOfSymbols:1};
function zx(){if(!zxP)zxP=new Promise((res,rej)=>{if(window.ZXingWASM)return res();const s=document.createElement('script');s.src='vendor/zxing/zxing-reader.js';s.onload=res;s.onerror=()=>rej(new Error('decoder script missing'));document.head.appendChild(s)}).then(()=>ZXingWASM.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith('.wasm')?new URL('vendor/zxing/'+p,location.href).href:pre+p},fireImmediately:true})).then(()=>window.ZXingWASM).catch(e=>{zxP=null;throw e});return zxP}
const scanMsg=t=>{const e=document.getElementById('scanmsg');if(e)e.textContent=t};
async function startCam(){
 const v=document.getElementById('scanvid');if(!v)return;
 try{await zx()}catch(e){CAM={ok:false,err:'Decoder failed to load: '+e.message,at:Date.now()};scanMsg(CAM.err+'. Type the number below.');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){CAM={ok:false,err:'No camera API (getUserMedia missing)',at:Date.now()};scanMsg('No camera access here. Type the number below.');return}
 try{CAMS=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
 catch(e){CAM={ok:false,err:e.name+': '+e.message,at:Date.now()};scanMsg(e.name==='NotAllowedError'?'Camera permission was denied. Allow it in iPhone Settings, or type the number below.':'Camera error ('+e.name+'). Type the number below.');return}
 if(!document.getElementById('scanvid')||!sheet||sheet.s!=='scan'){stopCam();return}
 v.srcObject=CAMS;v.muted=true;try{await v.play()}catch(e){}
 CAM={ok:true,at:Date.now(),frames:0,track:(CAMS.getVideoTracks()[0]||{}).label||''};scanMsg('Hold the barcode inside the frame.');
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let busy=false;
 scanLoop=setInterval(async()=>{if(busy||!v.videoWidth)return;busy=true;try{const sc=Math.min(1,960/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);cx.drawImage(v,0,0,cv.width,cv.height);const r=await ZXingWASM.readBarcodes(cx.getImageData(0,0,cv.width,cv.height),ZXOPT);CAM.frames++;CAM.size=v.videoWidth+'×'+v.videoHeight;const hit=r.find(x=>x.isValid&&x.text);if(hit&&scanLoop){CAM.code=hit.text;CAM.ms=Date.now()-CAM.at;hapt();lookupCode(hit.text)}}catch(e){CAM.err=String(e)}busy=false},150)}
function stopCam(){clearInterval(scanLoop);scanLoop=null;if(CAMS){CAMS.getTracks().forEach(t=>t.stop());CAMS=null}}
async function decodeFile(file){scanMsg('Reading the photo …');try{const z=await zx();const r=await z.readBarcodes(file,ZXOPT);const hit=r.find(x=>x.isValid&&x.text);if(hit){CAM.photo='decoded '+hit.text;lookupCode(hit.text)}else{CAM.photo='no barcode found';scanMsg('No barcode found in the photo. Try closer, or type the number.')}}catch(e){scanMsg('Could not read the photo: '+e.message)}}

async function askPersist(){try{if(!navigator.storage||!navigator.storage.persist){PERSIST={supported:false};return}const before=await navigator.storage.persisted();const result=before?true:await navigator.storage.persist();PERSIST={supported:true,before,result,at:Date.now()}}catch(e){PERSIST={supported:true,error:String(e)}}}

function insets(){const p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.appendChild(p);const cs=getComputedStyle(p),o={t:parseFloat(cs.paddingTop),r:parseFloat(cs.paddingRight),b:parseFloat(cs.paddingBottom),l:parseFloat(cs.paddingLeft)};p.remove();return o}
function drawEAN13(code){const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],R=L.map(p=>[...p].map(b=>b==='1'?'0':'1').join('')),G=R.map(p=>[...p].reverse().join('')),PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
 const d=[...code].map(Number);let bits='101';for(let i=1;i<=6;i++)bits+=(PAR[d[0]][i-1]==='L'?L:G)[d[i]];bits+='01010';for(let i=7;i<=12;i++)bits+=R[d[i]];bits+='101';
 const m=3,q=14*m,cv=document.createElement('canvas');cv.width=bits.length*m+2*q;cv.height=130;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#000';[...bits].forEach((b,i)=>{if(b==='1')c.fillRect(q+i*m,12,m,106)});return cv}
const measureFrames=ms=>new Promise(res=>{const t=[],s=performance.now();const f=now=>{t.push(now);if(now-s<ms)requestAnimationFrame(f);else{const d=t.slice(1).map((x,i)=>x-t[i]),avg=d.reduce((a,b)=>a+b,0)/Math.max(1,d.length);res({fps:Math.round(1000/avg),long:d.filter(x=>x>34).length,n:d.length,max:Math.round(Math.max(0,...d))})}};requestAnimationFrame(f)});

})();
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(S&&S.cur&&(!wlock||wlock.released))keepAwake();if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){sheet.q=t.value;document.getElementById('results').innerHTML=resultsHTML(t.value)}
 if(t.id==='dict'){sheet.q=t.value;document.getElementById('dres').innerHTML=dictHTML(t.value)}
 if(t.id==='dname'&&draft)draft.name=t.value;
 if(t.dataset.note){S.notes=S.notes||{};S.notes[t.dataset.note]=t.value;save()}
 if(t.dataset.dtnote){const m=DT.manual[t.dataset.dtnote]||(DT.manual[t.dataset.dtnote]={});m.note=t.value;saveDT()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.id==='bcin'){e.preventDefault();lookupCode(t.value)}if(t.id==='q'&&t.value.trim()){e.preventDefault();t.blur();A.offsearch()}});
document.addEventListener('change',e=>{const t=e.target,num=parseFloat(String(t.value).replace(',','.'));
 if(t.id==='wval'){const c=curSet();c.t.w=isNaN(num)?0:Math.max(0,num);if(c.t.w===0)c.t.d=undefined;clampD(c.t);propagate(c.x);save();render()}
 if(t.id==='dval'&&!isNaN(num)){const c=curSet();c.t.d=Math.max(0,num);clampD(c.t);propagate(c.x);save();render()}
 if(t.id==='bwval'&&!isNaN(num)){sheet.bw=num;render()}
 if(t.id==='amtval'&&!isNaN(num)){sheet.amt=Math.max(0,num);render()}
 if(t.id==='exsel'){sheet.ex=t.value;render()}
 if(t.dataset.g&&!isNaN(num)){const[a,b]=t.dataset.g.split('.');S.goals[a][b]=num;save()}
 if(t.id==='scanfile'&&t.files[0])decodeFile(t.files[0]);
 if((t.id==='impfile'||t.id==='sufile')&&t.files[0]){const f=t.files[0];f.text().then(txt=>{const p=parseImport(txt);if(t.id==='sufile')finishSetup(p.state,false);else{sheet={s:'restorefile',parsed:p};render()}}).catch(err=>{if(t.id==='sufile'){SU.msg=err.message;renderSetup()}else toast(err.message)});t.value=''}
});
document.addEventListener('focusin',e=>{if(e.target.matches('.stpc input'))e.target.select&&e.target.select()});

/* ---------- app open, resume, day change ---------- */
let hiddenAt=0,lastDay=today();
function onOpen(){if(GHC&&navigator.onLine)backup('app open')}
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden){hiddenAt=Date.now();return}if(today()!==lastDay){lastDay=today();render()}if(S.cur)keepAwake();if(hiddenAt&&Date.now()-hiddenAt>15*6e4)onOpen()});
setInterval(()=>{if(S&&!document.hidden&&today()!==lastDay){lastDay=today();render()}},60000);
addEventListener('online',()=>{if(S&&GHC&&(BK.lastErr||backupStale()))backup('back online')});


/* iOS fills the strip below a home screen app with the theme colour, so keep it in the tab bar colour of the open section */
const setTheme=()=>{const m=document.getElementById('themecolor'),c=S&&S.tab==='food'?'#6B3A27':'#3E3F97';if(m&&m.content!==c)m.content=c};
/* height iOS leaves below the app (screen minus viewport); the home bar spacing shrinks by that much */
const fixGap=()=>{const g=isStandalone()&&innerHeight>innerWidth?Math.max(0,Math.round(screen.height-innerHeight)):0;document.documentElement.style.setProperty('--vgap',g+'px')};
addEventListener('resize',fixGap);addEventListener('orientationchange',()=>setTimeout(fixGap,300));
async function boot(){
 fixGap();
 let hadCtl=false;
 if('serviceWorker' in navigator){hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(e=>{SWINFO.err=String(e)});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl)toast('A new version is ready',()=>location.reload(),'Reload',15000);hadCtl=true})}
 try{
  const dt=await DB.get('kv','devtest');if(dt)DT={auto:dt.auto||{},manual:dt.manual||{}};
  GHC=await DB.get('kv','gh')||null;BK=await DB.get('kv','backupMeta')||{};
  const st=await DB.get('kv','state');
  if(st&&st.cfg){S=Object.assign(stateFromCfg(st.cfg),st);applyCfg();lastDay=today();render();loadPhotos().catch(()=>{});askPersist();onOpen()}
  else renderSetup();
 }catch(e){const sh=document.getElementById('sheet');sh.hidden=false;sh.innerHTML=`<div class="shead"><h2>Storage problem</h2></div><div class="sbody"><p class="callout bad" style="margin:0">The app could not open its storage: ${esc(e.message||e)}. Close the app completely and open it again.</p></div>`}
}
boot();
</script>
